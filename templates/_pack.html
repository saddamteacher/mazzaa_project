{% load static %}<div class="pack pack--{{ size }}" style="--c:{{ p.flavor.color }}">
{% if p.image %}<img src="{{ p.image.url }}" alt="{{ p.name }}" loading="lazy">
{% elif p.weight.grams == 50 %}
<svg viewBox="0 0 200 240" role="img" aria-label="{{ p.name }}"><use href="#flame" fill="#7a0c0c"/><use href="#flame" fill="var(--c)" transform="translate(8 9) scale(.92)"/><use href="#flame" fill="#0d0605" opacity=".35" transform="translate(30 62) scale(.7)"/>
<circle cx="100" cy="42" r="7" fill="#0d0605"/><text x="100" y="128" class="pk-brand" transform="rotate(-8 100 128)">MAZZAA</text><text x="150" y="150" class="pk-w">{{ p.weight.grams }}g</text>
<use href="#chip" x="52" y="150" width="46" height="46" transform="rotate(-12 75 173)"/><use href="#chip" x="96" y="160" width="50" height="50" transform="rotate(14 121 185)"/></svg>
{% else %}
<svg viewBox="0 0 200 240" role="img" aria-label="{{ p.name }}"><path d="M22 14h156l8 14v196l-8 10H22l-8-10V28Z" fill="var(--c)"/><path d="M22 14h156l8 14H14Z" fill="#fff" opacity=".25"/><path d="M14 214h172v10l-8 10H22l-8-10Z" fill="#000" opacity=".25"/>
<path d="M14 150 Q100 110 186 150V214H14Z" fill="#0d0605" opacity=".28"/>
<text x="100" y="92" class="pk-brand" transform="rotate(-8 100 92)">MAZZAA</text><text x="158" y="206" class="pk-w">{{ p.weight.grams }}g</text>
{% if "stick" in p.slug %}<use href="#stick" x="40" y="140" width="110" height="20" transform="rotate(-18 95 150)"/><use href="#stick" x="48" y="160" width="110" height="20" transform="rotate(10 103 170)"/><use href="#stick" x="36" y="176" width="100" height="18" transform="rotate(-4 86 185)"/>
{% else %}<use href="#chip" x="36" y="128" width="58" height="58" transform="rotate(-14 65 157)"/><use href="#chip" x="92" y="140" width="62" height="62" transform="rotate(12 123 171)"/>{% endif %}</svg>
{% endif %}</div>
