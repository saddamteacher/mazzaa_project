{% load site static %}<section class="cta">
  <div class="wrap cta__in">
    <img class="cta__chili" src="{% static "img/chili.webp" %}" alt="" loading="lazy" width="700" height="603">
    <div>
      <h2>{% t "cta.title" %}</h2>
      <p>{% t "cta.text" %}</p>
      <a class="btn btn--gold" href="{% url "register" %}{% if country %}?country={{ country.code }}{% endif %}">{% t "cta.become" %}</a>
      <a class="btn btn--ghost" href="{% url "calculator" %}">{% t "nav.calculator" %}</a>
    </div>
  </div>
</section>
