# Render Blueprint: веб-сервис + PostgreSQL + cron для очереди Bitrix24.
services:
  - type: web
    name: mazzaa
    runtime: python
    plan: starter
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --workers 3 --timeout 60
    healthCheckPath: /robots.txt
    disk:                      # загруженные фото, видео и рекламные материалы
      name: media
      mountPath: /var/data/media
      sizeGB: 5
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.1"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase: {name: mazzaa-db, property: connectionString}
      - key: MEDIA_ROOT
        value: /var/data/media
      - key: ALLOWED_HOSTS
        sync: false            # например: mazzaa.uz,www.mazzaa.uz
      - key: SITE_URL
        sync: false            # например: https://mazzaa.uz
      - key: BITRIX24_WEBHOOK_URL
        sync: false            # секрет: вводится только в панели хостинга
  - type: cron
    name: mazzaa-crm-queue
    runtime: python
    schedule: "*/5 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py process_crm_queue
    envVars:
      - key: SECRET_KEY
        fromService: {type: web, name: mazzaa, envVarKey: SECRET_KEY}
      - key: DATABASE_URL
        fromDatabase: {name: mazzaa-db, property: connectionString}
      - key: BITRIX24_WEBHOOK_URL
        sync: false
databases:
  - name: mazzaa-db
    plan: basic-256mb
